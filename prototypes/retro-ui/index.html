<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retro UI Prototype</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="cabinet">

  <section class="tube" aria-label="Monitor">
    <div class="bezel">
      <div class="glass" id="glass">
        <div class="pic" id="pic">
          <img id="picBase" alt="Camera view" src="/public/images/cam1.webp">
          <img id="picGlow" class="glow" alt="" aria-hidden="true" src="/public/images/cam1.webp">
        </div>
        <canvas id="noise" class="fx" aria-hidden="true"></canvas>
        <div class="fx scan" aria-hidden="true"></div>
        <div class="fx vignette" aria-hidden="true"></div>
        <div class="osd osd-cam" id="osdCam">CAM 1</div>
        <div class="movie-sub" id="movieSub" aria-live="polite"></div>
        <div class="osd osd-rec"><i class="rec-dot"></i>REC</div>
      </div>
    </div>
    <div class="maker" aria-hidden="true"><span class="model">VIDEO MONITOR CR-42</span></div>
  </section>

  <section class="panel" aria-label="Control panel">

    <div class="row status">
      <div class="cell">
        <div class="label">SHIFT TIME</div>
        <div class="vfd" id="shiftTime">22:00</div>
      </div>
      <div class="cell">
        <div class="label">REPORTS</div>
        <div class="vfd"><span id="reports">0</span><span class="dim"> / 4</span></div>
      </div>
      <div class="cell">
        <div class="label">STRIKES</div>
        <div class="lamps" id="strikes" aria-label="Strikes 0 of 3">
          <i class="lamp amber"></i><i class="lamp amber"></i><i class="lamp amber"></i>
        </div>
      </div>
    </div>

    <div class="row knobs">
      <div class="knob-wrap">
        <div class="knob" id="knobBri" role="slider" tabindex="0" aria-label="Brightness" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><i class="mark"></i></div>
        <div class="label">BRIGHTNESS</div>
        <div class="drag-hint">&#9664; DRAG LEFT/RIGHT &#9654;</div>
      </div>
      <div class="knob-wrap">
        <div class="knob" id="knobCon" role="slider" tabindex="0" aria-label="Contrast" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><i class="mark"></i></div>
        <div class="label">CONTRAST</div>
        <div class="drag-hint">&#9664; DRAG LEFT/RIGHT &#9654;</div>
      </div>
    </div>

    <div class="row cams">
      <div class="label">CAMERA SELECT</div>
      <div class="cam-grid" id="camGrid"></div>
    </div>

    <div class="row report">
      <div class="report-main">
        <div class="lamp-big red" id="reportLamp"></div>
        <button type="button" class="key key-report" id="reportBtn" aria-expanded="false" aria-controls="cats">REPORT</button>
      </div>
      <div class="lcd" id="feedback" role="status">READY</div>
    </div>

    <div class="speaker" aria-hidden="true"></div>
  </section>
</main>
<div class="scrim" id="scrim" hidden>
  <div class="dialog" id="cats" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <div class="label dlg-title" id="dlgTitle">SELECT TYPE</div>
    <div class="cat-grid" id="catGrid"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
