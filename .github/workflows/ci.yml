name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Lint
        run: npm run lint

      - name: Check fullwidth digits in Japanese dialogue
        run: npm run check:fullwidth

      - name: Check spawn hints (3+ per anomaly)
        run: npm run check:spawn-hints

      - name: Test
        run: npm test

      - name: Selftest composite-polygon.py
        run: uv run --script scripts/composite-polygon.py --selftest

      - name: Monitor frame picture vs CSS opening and clip-path
        run: uv run --script scripts/bezel-frame.py check

      - name: Type check & Build
        run: npm run build
