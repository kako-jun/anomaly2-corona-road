# 毎回のゲーム終了時の会話。when.result: dawn（夜明け）| withdraw（撤収）| ending（エンディング）。
# 動作確認用の実例のみ（本制作ではない）。
dialogues:
  - id: closing-sample-01
    tone: light
    when: { result: dawn }
    lines:
      - { who: M, text: 'はい　朝ですね　引き継ぎに行ってきますよ' }
      - { who: A, text: 'やっと朝だね　お疲れさま　気をつけて帰って' }
  - id: closing-sample-02
    tone: serious
    when: { result: withdraw }
    lines:
      - { who: A, text: '今日はここまで　悔しいけど撤収しよう' }
      - { who: M, text: 'はい　分かりました　お疲れさまです' }
  - id: closing-sample-03
    tone: serious
    when: { result: ending }
    lines:
      - { who: A, text: '……何も映ってなかった　そういうことにしましょう' }
      - { who: M, text: 'はい　朝ですから' }
