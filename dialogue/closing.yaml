# 毎回のゲーム終了時の会話。夜明けと撤収は結果別に選ぶ。
dialogues:
  - id: closing-dawn-01
    tone: light
    when: { result: dawn, quota: met }
    lines:
      - { who: M, text: 'はい　朝ですね　引き継ぎに行ってきますよ', en: "It's morning. I'll go hand over to the next shift." }
      - { who: A, text: 'やっと朝だね　お疲れさま　気をつけて帰って', en: "Morning at last. Good work. Get home safe." }
  - id: closing-dawn-02
    tone: light
    when: { result: dawn, quota: met }
    lines:
      - { who: A, text: 'ああ　明るくなってる　終わったんだね', en: "Oh, it's getting light. We're done, then." }
      - { who: M, text: 'はい　引き継ぎの人も来ていますよ', en: "Yes, the next shift is here too." }
      - { who: A, text: 'よかった　これで帰れる', en: "Good. Now we can go home." }
  - id: closing-dawn-03
    tone: light
    when: { result: dawn, quota: unmet }
    lines:
      - { who: A, text: 'ふう　肩が固まってる　朝まで座りっぱなしだった', en: "Whew, my shoulders are stiff. I've been sitting here all night." }
      - { who: M, text: 'はい　少し伸ばしてください', en: "You should stretch a little." }
  - id: closing-dawn-04
    tone: light
    when: { result: dawn, quota: unmet }
    lines:
      - { who: A, text: '今夜も長かったね　外の空が白い', en: "Another long night. The sky's getting light." }
      - { who: M, text: 'そうですね　朝になりましたよ', en: "Yes, morning's here." }
  - id: closing-dawn-05
    tone: light
    when: { result: dawn, quota: met }
    lines:
      - { who: A, text: 'やった　朝だ！　眠いけど嬉しい', en: "Yes, it's morning! I'm tired, but I'm happy." }
      - { who: M, text: 'はい　お疲れさまでした', en: "Good work tonight." }
  - id: closing-dawn-06
    tone: light
    when: { result: dawn, quota: unmet }
    lines:
      - { who: A, text: '樫原くん　もう朝だよ　帰れるね', en: "It's morning, Kashihara. We can go home." }
      - { who: M, text: 'はい　その前に引き継ぎです', en: "Yes, after the handover." }
      - { who: A, text: 'そうだった　あと少し頑張ろう', en: "Right. Just a little longer, then." }
  - id: closing-dawn-07
    tone: light
    when: { result: dawn, quota: unmet }
    lines:
      - { who: M, text: '出河さん　外が明るいですよ', en: "Ms. Dekawa, it's getting light outside." }
      - { who: A, text: 'えっ　ほんと？　気づかなかった', en: "What, really? I didn't notice." }
      - { who: M, text: 'はい　窓の向こうが白んでます', en: "Yes, the sky's brightening through the window." }
  - id: closing-dawn-08
    tone: light
    when: { result: dawn, quota: unmet }
    lines:
      - { who: A, text: 'この時間の金沢　静かだね', en: "Kanazawa is quiet at this hour." }
      - { who: M, text: 'はい　通りはまだ静かですよ', en: "Yes, the streets are still quiet." }
  - id: closing-dawn-09
    tone: light
    when: { result: dawn, quota: unmet }
    lines:
      - { who: A, text: '朝の光　少し眩しい', en: "The morning light's a little bright." }
      - { who: M, text: '画面を見た後ですからね', en: "We've been staring at the screen." }
      - { who: A, text: 'そっか！　目が慣れてないんだ', en: "Right! My eyes aren't used to it." }
  - id: closing-dawn-10
    tone: light
    when: { result: dawn, quota: met }
    lines:
      - { who: A, text: 'ああ　やっと終わった　ほっとした', en: "Ah, finally done. What a relief." }
      - { who: M, text: 'はい　今夜の勤務は終了です', en: "Yes, tonight's shift is over." }
  - id: closing-dawn-11
    tone: light
    when: { result: dawn, quota: unmet }
    lines:
      - { who: M, text: '引き継ぎの人が来ましたよ', en: "The next shift is here." }
      - { who: A, text: 'ありがとう　助かった', en: "Thanks. That's a relief." }
      - { who: M, text: 'はい　こちらも戻ります', en: "I'll head back too." }
  - id: closing-dawn-12
    tone: light
    when: { result: dawn, quota: met }
    lines:
      - { who: A, text: '今日は眠れそう　今ならすぐ寝られる！', en: "I think I'll sleep today. I could fall asleep right now!" }
      - { who: M, text: 'はい　帰り道だけ気をつけてください', en: "Just be careful on your way home." }
  - id: closing-dawn-13
    tone: light
    when: { result: dawn, quota: met }
    lines:
      - { who: A, text: '朝の空気って　こんなに冷たかった？', en: "Was the morning air always this cold?" }
      - { who: M, text: 'はい　室内にいると忘れますね', en: "It's easy to forget when you're indoors." }
      - { who: A, text: 'だよね　外に出るのが楽しみ', en: "Right? I can't wait to get outside." }
  - id: closing-dawn-14
    tone: light
    when: { result: dawn, quota: met }
    lines:
      - { who: A, text: '夜勤明け　温かいもの食べたくなるね', en: "I always want something warm after a night shift." }
      - { who: M, text: 'はい　味噌汁とかいいですよ', en: "Miso soup would be nice." }
      - { who: A, text: '今朝もそれにしようかな', en: "Maybe I'll have that again this morning." }
  - id: closing-dawn-15
    tone: light
    when: { result: dawn, quota: unmet }
    lines:
      - { who: A, text: '最後にコーヒー飲もうかな', en: "Maybe I'll have one last coffee." }
      - { who: M, text: 'はい　朝なので飲みすぎ注意ですよ', en: "It's morning, so don't have too much." }
      - { who: A, text: '分かってる　たぶん', en: "I know. Probably." }
  - id: closing-dawn-16
    tone: light
    when: { result: dawn, quota: met }
    lines:
      - { who: A, text: '今日は無事に終われたね', en: "We got through tonight safely." }
      - { who: M, text: 'はい　お疲れさまです', en: "Yes. Good work." }
      - { who: A, text: 'いい朝だね', en: "It's a nice morning." }
  - id: closing-dawn-17
    tone: light
    when: { result: dawn, quota: unmet }
    lines:
      - { who: A, text: '引き継ぎが終わったら　すぐ帰るよ', en: "Once the handover's done, I'm heading straight home." }
      - { who: M, text: 'はい　俺も準備します', en: "I'll get ready too." }
  - id: closing-dawn-18
    tone: light
    when: { result: dawn, quota: unmet }
    lines:
      - { who: M, text: '出河さん　眼鏡を拭いたほうがいいですよ', en: "Ms. Dekawa, you might want to clean your glasses." }
      - { who: A, text: 'えっ　曇ってる？　ちょっと見せて', en: "What, are they fogged up? Let me see." }
      - { who: M, text: 'はい　朝の光で分かります', en: "You can see it in the morning light." }
  - id: closing-dawn-19
    tone: light
    when: { result: dawn, quota: met }
    lines:
      - { who: A, text: 'あっ　朝日　思ったよりきれいだね', en: "Oh, the sunrise is prettier than I expected." }
      - { who: M, text: 'はい　外が少しずつ明るくなってますよ', en: "Yes, it's getting brighter out there, little by little." }
  - id: closing-dawn-20
    tone: light
    when: { result: dawn, quota: met }
    lines:
      - { who: A, text: '明日の夜も　よろしくね', en: "See you again tomorrow night." }
      - { who: M, text: 'はい　いつもどおり来ますよ', en: "Yes, I'll be here as usual." }
  - id: closing-withdraw-01
    tone: serious
    when: { result: withdraw, quota: unmet }
    lines:
      - { who: A, text: '今日は撤収　もう少し見たかったのに', en: "We're calling it a night. I wanted to watch a little longer." }
  - id: closing-withdraw-02
    tone: serious
    when: { result: withdraw, quota: unmet }
    lines:
      - { who: A, text: 'ああもう　悔しいけど　ここで引き上げよう', en: "Damn it. I hate to, but let's pack up." }
  - id: closing-withdraw-03
    tone: serious
    when: { result: withdraw, quota: unmet }
    lines:
      - { who: A, text: '樫原くん　今日はここまで　先に立つね', en: "That's enough for today, Kashihara. I'll head out first." }
  - id: closing-withdraw-04
    tone: serious
    when: { result: withdraw, quota: unmet }
    lines:
      - { who: A, text: 'ごめん　頭を冷やしたい　撤収する', en: "Sorry, I need to clear my head. I'm calling it." }
  - id: closing-withdraw-05
    tone: serious
    when: { result: withdraw, quota: unmet }
    lines:
      - { who: A, text: '今夜は帰ろう　このまま続けてもだめだ', en: "Let's go home. There's no point carrying on like this." }
  - id: closing-withdraw-06
    tone: serious
    when: { result: withdraw, quota: unmet }
    lines:
      - { who: A, text: '撤収しよう　あと少しだった気がするのに', en: "Let's pack up. I felt like we were close, too." }
  - id: closing-withdraw-07
    tone: serious
    when: { result: withdraw, quota: unmet }
    lines:
      - { who: A, text: 'もう限界　今日は引き上げる', en: "I've had enough. I'm heading out for today." }
  - id: closing-withdraw-08
    tone: serious
    when: { result: withdraw, quota: unmet }
    lines:
      - { who: A, text: 'ここで切り上げる　悔しいけど決めた', en: "We're stopping here. I hate it, but I've decided." }
  - id: closing-withdraw-09
    tone: serious
    when: { result: withdraw, quota: unmet }
    lines:
      - { who: A, text: '今夜は撤収　明日また来るよ', en: "We're done for tonight. I'll be back tomorrow." }
  - id: closing-withdraw-10
    tone: serious
    when: { result: withdraw, quota: unmet }
    lines:
      - { who: A, text: 'だめだ　焦ってる　今日は止めよう', en: "No good. I'm rushing. Let's stop for today." }
  - id: closing-withdraw-11
    tone: serious
    when: { result: withdraw, quota: unmet }
    lines:
      - { who: A, text: '樫原くん　もう帰ろう　今は続けられない', en: "Let's go home, Kashihara. I can't carry on right now." }
  - id: closing-withdraw-12
    tone: serious
    when: { result: withdraw, quota: unmet }
    lines:
      - { who: A, text: 'こんなところで間違えるなんて　悔しい', en: "I can't believe I made a mistake there. Damn it." }
  - id: closing-withdraw-13
    tone: serious
    when: { result: withdraw, quota: unmet }
    lines:
      - { who: A, text: '落ち着かない　でも今日は撤収する', en: "I can't settle down, but we're done for today." }
  - id: closing-withdraw-14
    tone: serious
    when: { result: withdraw, quota: unmet }
    lines:
      - { who: A, text: '私が決めたことだ　引き上げよう', en: "It's my decision. Let's pack up." }
  - id: closing-withdraw-15
    tone: serious
    when: { result: withdraw, quota: unmet }
    lines:
      - { who: A, text: 'もう少し見たかった　でも今日は撤収', en: "I wanted to watch longer, but we're done for today." }
  - id: closing-withdraw-16
    tone: serious
    when: { result: withdraw, quota: unmet }
    lines:
      - { who: A, text: 'ごめんね　今日は私が先に帰る', en: "Sorry. I'm heading home first today." }
  - id: closing-withdraw-17
    tone: serious
    when: { result: withdraw, quota: unmet }
    lines:
      - { who: A, text: 'ここまでにする　少し頭を冷やしてくる', en: "That's enough. I need to clear my head." }
  - id: closing-withdraw-18
    tone: serious
    when: { result: withdraw, quota: unmet }
    lines:
      - { who: A, text: '続きが気になるけど　今夜は引き上げる', en: "I want to know what happens next, but we're done tonight." }
  - id: closing-withdraw-19
    tone: serious
    when: { result: withdraw, quota: unmet }
    lines:
      - { who: A, text: 'だめだ　今は冷静に見られない　撤収', en: "No good. I can't think straight. We're done." }
  - id: closing-withdraw-20
    tone: serious
    when: { result: withdraw, quota: unmet }
    lines:
      - { who: A, text: '悔しい　ほんとに悔しいけど　今日は終わり', en: "This is frustrating. It really is, but we're done today." }
  - id: closing-dawn-21
    tone: light
    when: { result: dawn, quota: met }
    lines:
      - { who: A, text: 'よし　いい収穫だったね', en: 'Good, a fine haul.' }
      - { who: M, text: 'はい　ずいぶん見つけましたね', en: 'Yes, you found quite a lot.' }
      - { who: A, text: 'ふふ　ちょっと誇らしい', en: "Heh, I'm a little proud." }
  - id: closing-dawn-22
    tone: light
    when: { result: dawn, quota: met }
    lines:
      - { who: M, text: '出河さん　今夜はけっこう見つけてましたよ', en: 'Ms. Dekawa, you found quite a few tonight.' }
      - { who: A, text: 'ほんと？　やった　ちょっと嬉しい', en: "Really? Yes! I'm a little happy." }
  - id: closing-dawn-23
    tone: light
    when: { result: dawn, quota: met }
    lines:
      - { who: A, text: '朝日がきれいに見えるなあ', en: 'The sunrise looks beautiful.' }
      - { who: M, text: 'いい夜だったから　そう見えるんですよ', en: "That's how it looks after a good night." }
      - { who: A, text: '単純だなあ　私', en: "I'm so simple." }
  - id: closing-dawn-24
    tone: light
    when: { result: dawn, quota: met }
    lines:
      - { who: A, text: '樫原くん　今夜は気持ちよく帰れるね', en: 'Kashihara, we can go home feeling good tonight.' }
      - { who: M, text: 'はい　引き継ぎの報告も楽です', en: 'Yes, and the handover report will be easy.' }
  - id: closing-dawn-25
    tone: light
    when: { result: dawn, quota: met }
    lines:
      - { who: M, text: '夜明けです　今夜の指摘は的確でしたよ', en: "It's dawn. Your calls were spot on tonight." }
      - { who: A, text: 'そう？　樫原くんに言われると照れるな', en: 'Really? I get shy when you say that, Kashihara.' }
      - { who: M, text: '事実を言っただけです', en: 'I only stated the facts.' }
  - id: closing-dawn-26
    tone: light
    when: { result: dawn, quota: met }
    lines:
      - { who: A, text: 'ふう　やりきった　朝ごはんがおいしそう', en: 'Whew, done and dusted. Breakfast is going to taste great.' }
      - { who: M, text: 'ご褒美ですね　甘いものもどうぞ', en: 'A reward, then. Have something sweet too.' }
      - { who: A, text: '話が分かる！', en: "Now you're talking!" }
  - id: closing-dawn-27
    tone: light
    when: { result: dawn, quota: met }
    lines:
      - { who: A, text: 'さて　今夜の成果を報告しに行こうか', en: "Well, shall we go report tonight's results?" }
      - { who: M, text: 'はい　堂々と持っていけますよ', en: 'Yes, we can carry them in with confidence.' }
  - id: closing-dawn-28
    tone: light
    when: { result: dawn, quota: met }
    lines:
      - { who: A, text: '眠い　でも少し嬉しい', en: 'Sleepy, but a little happy.' }
      - { who: M, text: 'いい夜でしたからね', en: 'It was a good night.' }
      - { who: A, text: 'また明日もこの調子でいこう', en: "Let's keep this up tomorrow too." }
  - id: closing-dawn-29
    tone: light
    when: { result: dawn, quota: met }
    lines:
      - { who: M, text: '朝です　今夜はよく見えてましたね', en: "It's morning. You were seeing well tonight." }
      - { who: A, text: '自分でも手応えあった　ちょっと嬉しい', en: "I felt it too. I'm a little happy." }
      - { who: M, text: '次の夜も期待してます', en: "I'm counting on the next night too." }
  - id: closing-dawn-30
    tone: light
    when: { result: dawn, quota: met }
    lines:
      - { who: A, text: '見つけた分だけ　朝が軽いね', en: 'The morning feels lighter for every one we found.' }
      - { who: M, text: '荷物が減った感じですか', en: 'Like a lighter load?' }
      - { who: A, text: 'そう　肩の荷が下りた', en: 'Yes. A weight off my shoulders.' }
  - id: closing-dawn-31
    tone: light
    when: { result: dawn, quota: met }
    lines:
      - { who: A, text: 'やった　今夜はよくできたよね？', en: 'Yes! I did well tonight, right?' }
      - { who: M, text: 'はい　冴えてましたよ', en: 'Yes, you were sharp.' }
      - { who: A, text: 'そんなに褒めると　本気にするよ', en: "If you praise me that much I'll believe it." }
      - { who: M, text: 'ほどほどにお願いします', en: 'Please keep it moderate.' }
  - id: closing-dawn-32
    tone: light
    when: { result: dawn, quota: met }
    lines:
      - { who: A, text: '誰かに自慢したい気分', en: 'I feel like bragging to someone.' }
      - { who: M, text: 'じゃあ　俺が聞いておきますよ', en: "Then I'll listen." }
  - id: closing-dawn-33
    tone: light
    when: { result: dawn, quota: unmet }
    lines:
      - { who: A, text: '朝か　今夜は　あまり見つけられなかったな', en: "Morning already. We didn't find much tonight." }
      - { who: M, text: 'そんな日もありますよ', en: 'Some nights are like that.' }
      - { who: A, text: '次はもう少し目を凝らす', en: "Next time I'll look harder." }
  - id: closing-dawn-34
    tone: light
    when: { result: dawn, quota: unmet }
    lines:
      - { who: M, text: '出河さん　夜が明けましたよ', en: 'Ms. Dekawa, the night is over.' }
      - { who: A, text: 'もうそんな時間？　何か見落とした気がする', en: 'Already? I feel like I missed something.' }
      - { who: M, text: '気のせいかもしれません　帰って寝ましょう', en: "Maybe it's nothing. Let's go home and sleep." }
  - id: closing-dawn-35
    tone: light
    when: { result: dawn, quota: unmet }
    lines:
      - { who: A, text: '悔しいなあ　あと少し　見つけられた気がする', en: 'Annoying. I feel like I could have found a few more.' }
      - { who: M, text: '次の夜に取り返しましょう', en: "We'll make it up on the next night." }
  - id: closing-dawn-36
    tone: light
    when: { result: dawn, quota: unmet }
    lines:
      - { who: A, text: '朝日がまぶしい　でも心はまだ夜のまま', en: 'The sun is bright but my mind is still in the night.' }
      - { who: M, text: '詩的ですね', en: 'How poetic.' }
      - { who: A, text: 'からかわないの', en: "Don't tease me." }
  - id: closing-dawn-37
    tone: light
    when: { result: dawn, quota: unmet }
    lines:
      - { who: M, text: '引き継ぎの人が来ました　報告は短めですね', en: 'The next shift is here. The report will be short.' }
      - { who: A, text: 'うっ　言わないで', en: "Ouch. Don't say it." }
  - id: closing-dawn-38
    tone: light
    when: { result: dawn, quota: unmet }
    lines:
      - { who: A, text: '見落としが　どこかにあったんだろうな', en: 'There must have been something I overlooked somewhere.' }
      - { who: M, text: 'あったとしても　次がありますよ', en: 'Even so, there is a next time.' }
  - id: closing-dawn-39
    tone: light
    when: { result: dawn, quota: unmet }
    lines:
      - { who: A, text: '帰ったら　今夜の画面を思い出してみる', en: "When I get home I'll replay tonight's screens in my head." }
      - { who: M, text: 'それ　寝られなくなるやつですよ', en: "That's the kind of thing that keeps you awake." }
      - { who: A, text: 'たしかに　やめとく', en: "True. I'll skip it." }
  - id: closing-dawn-40
    tone: light
    when: { result: dawn, quota: unmet }
    lines:
      - { who: A, text: 'はあ　朝だ　物足りない夜だった', en: "Haa, it's morning. That night felt unfinished." }
      - { who: M, text: 'コーヒー淹れましょうか', en: 'Shall I make some coffee?' }
      - { who: A, text: 'お願い　濃いやつね', en: 'Please. Make it strong.' }
  - id: closing-dawn-41
    tone: light
    when: { result: dawn, quota: unmet }
    lines:
      - { who: M, text: '朝です　今夜は静かな夜でしたね', en: "It's morning. A quiet night, wasn't it." }
      - { who: A, text: '静かすぎて　見逃したのかも', en: 'So quiet that I may have missed something.' }
      - { who: M, text: '静かな夜も　あっていいんですよ', en: 'Quiet nights are allowed too.' }
  - id: closing-dawn-42
    tone: light
    when: { result: dawn, quota: unmet }
    lines:
      - { who: A, text: 'ああ　あのカメラ　もっと見ておけばよかった', en: 'Ah, I should have watched that camera more.' }
      - { who: M, text: '次はそこから見ましょう', en: "Next time let's start there." }
  - id: closing-dawn-43
    tone: light
    when: { result: dawn, quota: unmet }
    lines:
      - { who: A, text: 'ぼちぼちの夜だったかな', en: 'I guess it was a so-so night.' }
      - { who: M, text: 'ぼちぼちが一番続きますよ', en: 'So-so is what lasts the longest.' }
      - { who: A, text: 'それ　慰めてる？', en: 'Are you trying to comfort me?' }
  - id: closing-dawn-44
    tone: light
    when: { result: dawn, quota: unmet }
    lines:
      - { who: A, text: '夜が明けちゃった　もう少し粘りたかったのに', en: 'The night is over. I wanted to hold out a bit longer.' }
      - { who: M, text: '次の夜に続きをしましょう', en: "We'll continue on the next night." }
  - id: closing-withdraw-21
    tone: serious
    when: { result: withdraw, quota: met }
    lines:
      - { who: A, text: '撤収するよ　でも　今夜はちゃんと見つけた', en: "We're pulling out, but we did find things tonight." }
      - { who: M, text: 'はい　報告書に書いておきます', en: "Yes, I'll write it in the report." }
  - id: closing-withdraw-22
    tone: serious
    when: { result: withdraw, quota: met }
    lines:
