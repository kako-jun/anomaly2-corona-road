# 異変の出現ヒント（#343）。異変が見つからないまま時間が経った時に、確率 hintChance で出る会話。
# kako-jun の決定（2026-11-12）: ヒント用のセリフは作って、1度だけでなく何度も表示し、確率 50% にする。
# 誤報用の anomaly-lines.yaml とはプールが別（使用済みにならず、直前に出した案は避ける）。
# when.anomaly は prompts/anomalies.yaml の id。id は spawn-hint-<異変id>-連番。台帳の画像異変（produced）全件に3案以上
# （足りない異変は npm run check:spawn-hints が列挙する）。位置だけを言う（何がおかしいかは言わない）。お手つき前提にしない。
# 並びは台帳の順。
dialogues:
  - id: spawn-hint-AR-01-notice-01
    tone: serious
    when: { anomaly: AR-01-notice }
    lines:
      - { who: A, text: "左の壁の辺り　ちょっと気になるな", en: "Something about the left wall bugs me." }
      - { who: M, text: "そうですか　見てみます", en: "Does it? I'll take a look." }
  - id: spawn-hint-AR-01-notice-02
    tone: serious
    when: { anomaly: AR-01-notice }
    lines:
      - { who: M, text: "左の壁を確認してもらえますか", en: "Could you check the left wall?" }
      - { who: A, text: "いいよ　左の壁ね", en: "Sure. The left wall, right?" }
  - id: spawn-hint-AR-01-notice-03
    tone: serious
    when: { anomaly: AR-01-notice }
    lines:
      - { who: A, text: "左の壁に　目が行くんだよね…", en: "My eyes keep going to the left wall..." }
  - id: spawn-hint-AR-02-ashtray-01
    tone: serious
    when: { anomaly: AR-02-ashtray }
    lines:
      - { who: A, text: "右手前の台の辺り　見てごらん", en: "Look near the stand in the front right." }
      - { who: M, text: "右手前の台ですか　目を向けます", en: "The front-right stand? I will look." }
  - id: spawn-hint-AR-02-ashtray-02
    tone: serious
    when: { anomaly: AR-02-ashtray }
    lines:
      - { who: M, text: "右手前の台の上が　気になります", en: "The top of the front-right stand bothers me." }
      - { who: A, text: "台の上ね　私も見る", en: "The top of the stand. I'll look too." }
  - id: spawn-hint-AR-02-ashtray-03
    tone: serious
    when: { anomaly: AR-02-ashtray }
    lines:
      - { who: A, text: "右の手前にある台　じっくり見よう", en: "Let's study the stand at the front right." }
