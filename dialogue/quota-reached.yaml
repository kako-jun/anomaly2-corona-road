      - { who: A, text: 'ふふ　見えるうちに見ておく', en: "Heh, I'll look while I can see this well." }
  - id: quota-reached-07
    tone: light
    lines:
      - { who: A, text: 'ふう　いい手応え　でも画面からは目を離さないよ', en: "Whew, that felt good, but I'm not taking my eyes off the screens." }
