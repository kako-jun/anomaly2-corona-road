# 進行フラグが立ったときに一度だけ再生する本制作のストーリー会話。
dialogues:
  - id: story-elder1
    tone: serious
    when: { flag: elder1 }
    lines:
      - { who: A, text: 'やっと見つかったのに　帰りたくないって？　なんで…', en: "We finally found him, and he doesn't want to come home? Why...?" }
      - { who: M, text: '食べるものもあるし困ってない　帰るかは自分で決めると　きっぱり言ってました', en: "He has food and says he's fine. He insists it's his choice to make." }
      - { who: A, text: '家族が待ってるのに　そんなのつらいよ…', en: "But his family is waiting for him. That's so hard..." }
  - id: story-elder2
    tone: serious
    when: { flag: elder2 }
    lines:
      - { who: A, text: 'また？　２人目も　帰りたくないって言ったの？', en: "Again? The second one doesn't want to come home either?" }
      - { who: M, text: 'はい　帰らないと言ったあと　こちらの体調まで　気づかってました', en: "Yes. After she told us she was staying, she even asked if I was well." }
      - { who: A, text: '自分のことより？　やさしい人なんだね…', en: "She was worried about you? What a kind person..." }
  - id: story-elder3
    tone: serious
    when: { flag: elder3 }
    lines:
      - { who: A, text: '３人とも帰らないなんて　そんなことある？', en: "All three of them want to stay? How can that be?" }
      - { who: M, text: '３人目は「帰りたい場所なら　とっくに　帰ってますよ」と笑ってました', en: "The third man laughed and said, 'If I wanted to go back, I'd be there.'" }
      - { who: A, text: 'そんなふうに言われたら　怒れないよ…', en: "When he puts it like that, how can I be angry...?" }
  - id: story-child
    tone: serious
    when: { flag: child }
    lines:
      - { who: A, text: '見つけた…よかった　でも家へ戻せば解決なの？', en: "We found the child... Thank goodness. But would sending them home fix it?" }
      - { who: M, text: '老人たちの様子では　異変の食べ物でも効くようです', en: "The others seem to get by on food from the anomalies." }
      - { who: A, text: '餓死を心配して急ぐ必要はないね　帰りたくない理由を調べよう', en: "If starvation isn't urgent, let's find out why the child won't go home." }
      - { who: M, text: 'はい　家族のことを調べましょう', en: "Yes. Let's look into the family." }
  - id: story-child-response
    tone: serious
    when: { flag: childResponse }
    lines:
      - { who: A, text: '樫原くん　あの子が話すまで待ってたね', en: "Kashihara, you waited for the child to speak." }
      - { who: M, text: 'はい　怖がらせたくなかったので', en: "Yes. I didn't want to scare them." }
      - { who: A, text: '子供には優しいんだね　父性本能かな？', en: "You're good with kids. Paternal instincts, maybe?" }
      - { who: M, text: 'そこまでじゃないですよ　心配だっただけです', en: "I wouldn't go that far. I was just worried." }
  # 令和の異変の前触れ（#430）。令和の異変が初めて出た時に1回（袋から1つ）。台詞は kako-jun の承認待ち（仮）。
  - id: story-reiwa-prelude-1
    tone: serious
    when: { flag: reiwaPrelude }
    lines:
      - { who: A, text: '今の異変　見たことのない種類じゃない？', en: "That anomaly just now... I've never seen that kind before." }
      - { who: M, text: 'はい　これまでと　何かが違います', en: "Yes. Something is different from the others." }
  - id: story-reiwa-prelude-2
    tone: serious
    when: { flag: reiwaPrelude }
    lines:
      - { who: M, text: '出河さん　新しい種類の　異変が出ているような', en: "Dekawa-san, it looks like a new kind of anomaly is showing up." }
      - { who: A, text: 'うん　昭和じゃない匂いがする…', en: "Yeah. It doesn't smell like the Showa era..." }
  - id: story-reiwa-prelude-3
    tone: serious
    when: { flag: reiwaPrelude }
    lines:
      - { who: A, text: '今までの異変と　どこか違うよね', en: "It feels different from the anomalies so far, doesn't it?" }
      - { who: M, text: '何かが　変わり始めたのかもしれません', en: "Maybe something has started to change." }
  # 子供の前触れ（#430）。子供の出現条件を満たした時に1回（袋から1つ）。台詞は kako-jun の承認待ち（仮）。
  - id: story-child-prelude-1
    tone: serious
    when: { flag: childPrelude }
    lines:
      - { who: A, text: '…空気が　変わった気がする', en: "...The air just changed." }
      - { who: M, text: '僕もです　何かが近づいてます', en: "I feel it too. Something is getting close." }
  - id: story-child-prelude-2
    tone: serious
    when: { flag: childPrelude }
    lines:
      - { who: M, text: '急に静かになりましたね', en: "It suddenly got quiet." }
      - { who: A, text: '嫌な感じじゃない　むしろ…', en: "It's not a bad feeling. If anything..." }
  - id: story-child-prelude-3
    tone: serious
    when: { flag: childPrelude }
    lines:
      - { who: A, text: '樫原くん　カメラから目を離さないで', en: "Kashihara, don't take your eyes off the cameras." }
      - { who: M, text: 'はい　何か来る気がします', en: "Yes. I think something is coming." }
