# 進行フラグが立ったときに一度だけ再生する本制作のストーリー会話。
dialogues:
  - id: story-elder1
    tone: serious
    when: { flag: elder1 }
    lines:
      - { who: A, text: 'やっと見つかったのに　帰りたくないって?　なんで…' }
      - { who: M, text: 'はい　本人はそう言ってますよ　懐かしい場所にいたいと' }
      - { who: A, text: '家族が待ってるのに　そんなのつらいよ…' }
  - id: story-elder2
    tone: serious
    when: { flag: elder2 }
    lines:
      - { who: A, text: 'また?　二人目も帰りたくないって言ったの?' }
      - { who: M, text: 'はい　前の人と同じですよ　昔の場所に残りたいそうです' }
      - { who: A, text: 'どうしてそんなに　帰るのが嫌なんだろう' }
  - id: story-elder3
    tone: serious
    when: { flag: elder3 }
    lines:
      - { who: A, text: '三人とも帰らないなんて　そんなことある?' }
      - { who: M, text: 'はい　三人とも本人の希望だそうですよ' }
      - { who: A, text: 'そんな顔で言われたら　怒れないよ…' }
  - id: story-child
    tone: serious
    when: { flag: child }
    lines:
      - { who: A, text: '今度は子供だって?　そんなの　早く見つけないと!' }
      - { who: M, text: 'はい　大人の時とは話が違いますよ' }
      - { who: A, text: '分かってる　あの子の家族も待ってるんだから' }
