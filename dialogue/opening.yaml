# 開始時の定番のやり取り。各勤務のはじめに一度だけ再生する。
dialogues:
  - id: opening-01
    tone: light
    lines:
      - { who: A, text: '樫原くん　今夜も監視をお願いできる?' }
      - { who: M, text: 'はい　出河さん　そのために来てますから' }
      - { who: A, text: '金沢へ来る前は　夜も賑やかだと思ってたのに' }
      - { who: M, text: 'この辺は　店が閉まるとこんな感じですよ' }
  - id: opening-02
    tone: light
    lines:
      - { who: M, text: 'お疲れさまです　机の上を片づけましたよ' }
      - { who: A, text: '助かった　これじゃ資料を　広げられないって　困ってたの' }
  - id: opening-03
    tone: light
    lines:
      - { who: A, text: 'あっ　この椅子　少し借りてもいい?' }
      - { who: M, text: 'はい　出河さんの席として　空けてありますよ' }
  - id: opening-04
    tone: light
    lines:
      - { who: M, text: '巡回表　更新しておきましたよ' }
      - { who: A, text: 'ありがとう!　これで確認できる' }
  - id: opening-05
    tone: light
    lines:
      - { who: A, text: '無線の音　聞こえにくくない?' }
      - { who: M, text: 'はい　音量は問題ないですよ' }
  - id: opening-06
    tone: light
    lines:
      - { who: M, text: 'お湯　沸かしておきましたよ' }
      - { who: A, text: '助かる!　今夜は温かいものにする' }
  - id: opening-07
    tone: light
    lines:
      - { who: A, text: 'さむっ　ここ　思ったより冷えるね' }
      - { who: M, text: '空調を弱めますか' }
      - { who: A, text: 'お願い　助かる' }
      - { who: M, text: 'はい　すぐやりますよ' }
  - id: opening-08
    tone: light
    lines:
      - { who: A, text: 'このメモ　机の端に置いていい?' }
      - { who: M, text: 'そこだと落ちますよ　こちらへ寄せますか' }
  - id: opening-09
    tone: light
    lines:
      - { who: M, text: '書くもの　足りてますか' }
      - { who: A, text: 'あっ　ペンがない　一本借りていい?' }
      - { who: M, text: 'はい　予備ありますよ' }
  - id: opening-10
    tone: light
    lines:
      - { who: A, text: '飲み物　ここに置いて大丈夫?' }
      - { who: M, text: 'はい　機械の近くを　避ければ大丈夫ですよ' }
  - id: opening-11
    tone: light
    lines:
      - { who: M, text: '今夜は巡回を少し遅めにします' }
      - { who: A, text: 'わかった　戻ったら必ず声をかけてね' }
  - id: opening-12
    tone: light
    lines:
      - { who: A, text: '画面の明るさ　これで見える?　まぶしい!' }
      - { who: M, text: '一段落としますか' }
      - { who: A, text: 'お願い　さっきより見やすい' }
      - { who: M, text: 'はい　この程度でいいですよ' }
  - id: opening-13
    tone: light
    lines:
      - { who: M, text: '荷物は棚の下に　置いておきましたよ' }
      - { who: A, text: 'ありがとう　あっ　これなら邪魔にならないね' }
  - id: opening-14
    tone: light
    lines:
      - { who: A, text: '引き継ぎの紙　あとで見せて?' }
      - { who: M, text: 'もう机に置いてありますよ　上から二枚目です' }
      - { who: A, text: '助かる　見落とすと困るからね' }
  - id: opening-15
    tone: light
    lines:
      - { who: M, text: '窓は閉めてあります　外の音は入らないですよ' }
      - { who: A, text: '静かすぎると落ち着かないね' }
  - id: opening-16
    tone: light
    lines:
      - { who: A, text: '東京より金沢の夜は　静かに感じる' }
      - { who: M, text: '店が閉まると　この辺はこんな感じですよ' }
      - { who: A, text: 'へえ　少し寂しいけど　嫌いじゃない' }
  - id: opening-17
    tone: light
    lines:
      - { who: A, text: '勤務中に食べてもいいもの　何かある?' }
      - { who: M, text: '飴なら　引き出しにありますよ' }
      - { who: A, text: 'あっ　ちょうど甘いもの欲しかった　一つもらっていい?' }
      - { who: M, text: 'はい　どうぞ' }
  - id: opening-18
    tone: light
    lines:
      - { who: M, text: '電話の音量　下げますか' }
      - { who: A, text: 'あっ　お願い　鳴るとびっくりするから' }
      - { who: M, text: 'はい　小さくしましたよ' }
  - id: opening-19
    tone: light
    lines:
      - { who: A, text: '今夜も長くなりそうだね' }
      - { who: M, text: '朝には終わりますよ　急がなくて大丈夫です' }
      - { who: A, text: '私　そんなに焦ってる顔してる?' }
      - { who: M, text: 'はい　少し出てますよ' }
  - id: opening-20
    tone: light
    lines:
      - { who: A, text: '樫原くん　無理はしないで' }
      - { who: M, text: 'はい　出河さんも休憩を取ってください' }
      - { who: A, text: '私?　そんなに　無理してるように見える?' }
      - { who: M, text: '少し' }
