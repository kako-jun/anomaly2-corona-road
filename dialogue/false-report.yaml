# 共通の誤報会話。異変ごとの会話にヒントを任せ、ここには手がかりを入れない。
dialogues:
  - id: false-report-01
    tone: light
    lines:
      - { who: A, text: 'えっ　今の違ったの？　私の見間違い？', en: "Huh? That wasn't it? Did I see it wrong?" }
      - { who: M, text: 'はい　今のは違いますよ', en: "Yes, that one wasn't it." }
  - id: false-report-02
    tone: light
    lines:
      - { who: A, text: 'うそ　また違う？　ちょっと悔しい', en: "No way, wrong again? That's frustrating." }
      - { who: M, text: 'はい　でも確認するのは大事ですよ', en: "Yes, but checking is important." }
  - id: false-report-03
    tone: light
    lines:
      - { who: A, text: 'ああ　今のは気のせいだった', en: "Oh, that was just my imagination." }
      - { who: M, text: 'はい　そういうこともありますよ', en: "Yes, it happens." }
  - id: false-report-04
    tone: light
    lines:
      - { who: A, text: 'ええっ　全然違ったの？', en: "Wait, I was completely wrong?" }
      - { who: M, text: 'はい　今回は違いました', en: "Yes, not this time." }
      - { who: A, text: '自信あったのに！', en: "I was so sure!" }
  - id: false-report-05
    tone: light
    lines:
      - { who: A, text: '今の記録されちゃう？', en: "Will that go in the log?" }
      - { who: M, text: 'はい　記録には残りますよ', en: "Yes, it'll be recorded." }
      - { who: A, text: 'うわ　見られるの恥ずかしい', en: "Ugh, it's embarrassing to be seen." }
  - id: false-report-06
    tone: light
    lines:
      - { who: A, text: 'ごめん　早とちりした', en: "Sorry, I jumped the gun." }
      - { who: M, text: '大丈夫ですよ　続けましょう', en: "It's okay. Let's keep going." }
  - id: false-report-07
    tone: light
    lines:
      - { who: A, text: 'またやっちゃった　私らしくない', en: "There I go again. That's not like me." }
      - { who: M, text: '疲れてると　判断が早くなりますよ', en: "When you're tired, you decide too quickly." }
      - { who: A, text: 'えっ　疲れてる顔してる？', en: "Huh? Do I look tired?" }
  - id: false-report-08
    tone: light
    lines:
      - { who: M, text: 'はい　今のは誤報ですよ', en: "Yes, that was a false report." }
      - { who: A, text: 'そんなに淡々と　言わなくてもいいよ', en: "You don't have to say it so flatly." }
      - { who: M, text: '結果なので', en: "It's the result." }
  - id: false-report-09
    tone: light
    lines:
      - { who: A, text: '今の　惜しかった？', en: "Was I close?" }
      - { who: M, text: '惜しくはないですよ　違いました', en: "Not really. It was wrong." }
      - { who: A, text: 'きびしい！', en: "Harsh!" }
      - { who: M, text: 'すみません　そういう意味では', en: "Sorry, I didn't mean it that way." }
  - id: false-report-10
    tone: light
    lines:
      - { who: A, text: '私の目　どうかしてる？', en: "Is something wrong with my eyes?" }
      - { who: M, text: 'いえ　報告が違っただけですよ', en: "No, you just reported the wrong one." }
      - { who: A, text: 'あっ　そういう言い方してくれるんだ', en: "Oh, that's a nice way to put it." }
  - id: false-report-11
    tone: light
    lines:
      - { who: A, text: 'ちょっと待って　自信あったのに', en: "Wait a second, I was sure." }
      - { who: M, text: '自信があったのは伝わりましたよ', en: "I could tell you were sure." }
      - { who: A, text: 'それ　慰めになってない！', en: "That's not comforting!" }
  - id: false-report-12
    tone: light
    lines:
      - { who: M, text: '誤報でした　次を見ましょう', en: "That was a false report. Let's check the next one." }
      - { who: A, text: '分かったから　そんなに正確に言わなくていいよ', en: "I know, you don't have to be so precise about it." }
  - id: false-report-13
    tone: light
    lines:
      - { who: A, text: 'ああもう　間違えた', en: "Oh, I did it again. I was wrong." }
      - { who: M, text: 'はい　次がありますよ', en: "Yes, there's always the next one." }
      - { who: A, text: 'その言い方　ちょっと軽いよ', en: "That sounded a little too casual." }
      - { who: M, text: 'すみません　口が滑りました', en: "Sorry, that slipped out." }
  - id: false-report-14
    tone: light
    lines:
      - { who: A, text: '今のなし！　ってできないよね', en: "I can't just take that one back, can I?" }
      - { who: M, text: 'はい　記録は消せないですよ', en: "No, the record can't be erased." }
      - { who: A, text: 'ええっ　やっぱり残るんだ', en: "Wait, it stays in the log?" }
  - id: false-report-15
    tone: light
    lines:
      - { who: A, text: '誤報って　こんなに悔しいんだね', en: "False reports are this frustrating, huh?" }
      - { who: M, text: 'はい　初めて知りました？', en: "Yes. Is this your first time finding out?" }
      - { who: A, text: 'うん　できれば知らずにいたかった', en: "Yeah. I wish I'd never learned." }
  - id: false-report-16
    tone: light
    lines:
      - { who: A, text: '今度は落ち着いて見る　絶対', en: "Next time I'll take a calm look. I mean it." }
      - { who: M, text: 'はい　そのほうがいいですよ', en: "Yes, that would be better." }
      - { who: A, text: 'そんなに真顔で言わなくても！', en: "You don't have to say it with such a straight face!" }
  - id: false-report-17
    tone: light
    lines:
      - { who: A, text: '今のは間違い　はい　分かってる', en: "That was wrong. Yes, I know." }
      - { who: M, text: 'はい　確認できましたよ', en: "Yes, it's confirmed." }
      - { who: A, text: '確認の声まで落ち着いてるね', en: "Even your confirmation sounds calm." }
  - id: false-report-18
    tone: light
    lines:
      - { who: A, text: 'ごめん　また先走った', en: "Sorry, I jumped ahead again." }
      - { who: M, text: '謝らなくて大丈夫ですよ', en: "You don't need to apologize." }
      - { who: A, text: 'そう言われると　余計申し訳ないよ', en: "When you say that, I feel even worse." }
  - id: false-report-19
    tone: light
    lines:
      - { who: A, text: 'もう一回　落ち着いてやる', en: "I'll try again, calmly." }
      - { who: M, text: 'はい　次も見ていますよ', en: "Yes, I'll keep watching too." }
      - { who: A, text: 'ありがとう　頼りにしてる', en: "Thanks. I'm counting on you." }
  - id: false-report-20
    tone: light
    lines:
      - { who: A, text: 'えっ　また違う？　今日はだめだなあ', en: "Huh, wrong again? I'm having a bad night." }
      - { who: M, text: '今日はまだ終わってないですよ', en: "The night isn't over yet." }
      - { who: A, text: 'そうだね　ここから取り返す！', en: "Right. I'll make up for it from here!" }
  - id: false-report-met-01
    tone: light
    when: { quota: met }
    lines:
      - { who: A, text: 'あっ　もう十分見つけたのに　最後に間違えた', en: 'Oh, I had already found enough and I slipped at the end.' }
      - { who: M, text: 'はい　でも今夜の分は届いてますよ', en: "Yes, but you have reached tonight's mark." }
  - id: false-report-met-02
    tone: light
    when: { quota: met }
    lines:
      - { who: A, text: 'うわ　調子に乗った', en: 'Ugh, I got ahead of myself.' }
      - { who: M, text: '少しだけ乗ってましたね', en: 'Just a little.' }
      - { who: A, text: '正直に言わないで', en: 'Do not be so honest.' }
  - id: false-report-met-03
    tone: light
    when: { quota: met }
    lines:
      - { who: A, text: 'ちぇっ　ここまで順調だったのに', en: 'Tch, and it was going so well.' }
      - { who: M, text: 'お手つきは１回です　大丈夫ですよ', en: 'It is one slip. It is fine.' }
  - id: false-report-met-04
    tone: light
    when: { quota: met }
    lines:
      - { who: M, text: '今のは違いますよ', en: 'That one was not it.' }
      - { who: A, text: '分かってる　ちょっと照れくさい', en: 'I know. A bit embarrassing.' }
      - { who: M, text: '見つけた分は残りますから', en: 'What you found stays.' }
  - id: false-report-met-05
    tone: light
    when: { quota: met }
    lines:
      - { who: A, text: 'もう十分なのに　欲が出ちゃった', en: 'I had enough and still got greedy.' }
      - { who: M, text: '欲張りは　出河さんの悪い癖ですね', en: 'Greed is your bad habit, Ms. Dekawa.' }
      - { who: A, text: '言うねえ', en: 'You do not hold back.' }
  - id: false-report-met-06
    tone: light
    when: { quota: met }
    lines:
      - { who: A, text: '格好悪いところ見せちゃったね', en: 'I showed you something uncool.' }
      - { who: M, text: 'いえ　ここまで頼もしかったですよ', en: 'No, you were reliable up to now.' }
  - id: false-report-met-07
    tone: light
    when: { quota: met }
    lines:
      - { who: A, text: 'ああ　最後まで格好よくいきたかった', en: 'Ah, I wanted to look cool to the very end.' }
      - { who: M, text: 'まだ夜は続いてますよ', en: 'The night is not over yet.' }
  - id: false-report-met-08
    tone: light
    when: { quota: met }
    lines:
      - { who: A, text: '見間違い？　今までは当たってたのに', en: 'A mistake? I was right until now.' }
      - { who: M, text: '好調の波が　ひと休みですかね', en: 'Maybe the good streak is taking a break.' }
      - { who: A, text: 'ひどい！', en: 'That is mean!' }
  - id: false-report-met-09
    tone: light
    when: { quota: met }
    lines:
      - { who: M, text: 'あ　今のは違いました', en: 'Ah, that one was wrong.' }
      - { who: A, text: 'もう　恥ずかしいなあ', en: 'Oh, how embarrassing.' }
      - { who: M, text: '見つけた数は減りませんよ', en: 'It does not take away what you found.' }
      - { who: A, text: 'それでも悔しいの！', en: 'I am still annoyed!' }
