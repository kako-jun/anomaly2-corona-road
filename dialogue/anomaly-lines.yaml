# 異変ごとの会話（お手つきのときの小さなヒントを含む）。when.anomaly は prompts/anomalies.yaml の id。
# id は an-<異変id>-連番。各異変に二つのヒント案を登録する。
dialogues:
  - id: an-AR-01-notice-01
    tone: serious
    when: { anomaly: AR-01-notice }
    lines:
      - { who: A, text: '焦るとだめだね　左の壁をゆっくり確認しよう' }
      - { who: M, text: 'そうですね　左の壁を少し引いて見ます' }
  - id: an-AR-01-notice-02
    tone: serious
    when: { anomaly: AR-01-notice }
    lines:
      - { who: M, text: 'いったん全体を見て　左の壁に戻ってください' }
      - { who: A, text: '分かった　左の壁は後でもう一度見るね' }
  - id: an-AR-02-ashtray-01
    tone: serious
    when: { anomaly: AR-02-ashtray }
    lines:
      - { who: A, text: '念のため　右手前も確かめておこう' }
      - { who: M, text: 'はい　右手前の端も　見落とさないようにします' }
  - id: an-AR-02-ashtray-02
    tone: serious
    when: { anomaly: AR-02-ashtray }
    lines:
      - { who: M, text: '視点を少しずらして　右手前を見てみましょう' }
      - { who: A, text: 'そうか　右手前の前後も見てみるね' }
  - id: an-AR-02-bag-01
    tone: serious
    when: { anomaly: AR-02-bag }
    lines:
      - { who: A, text: '右手前の床の辺り　見方を変えたら分かるかな' }
      - { who: M, text: 'はい　右手前の床から順に確認していきます' }
  - id: an-AR-02-bag-02
    tone: serious
    when: { anomaly: AR-02-bag }
    lines:
      - { who: M, text: '焦らずに　右手前の床のあたりを見てください' }
      - { who: A, text: 'えっ　右手前の床まで見るの?　ちゃんと見る!' }
  - id: an-AR-02-blue-pot-01
    tone: serious
    when: { anomaly: AR-02-blue-pot }
    lines:
      - { who: A, text: 'うーん　視線が止まってたね　右手前も見よう' }
      - { who: M, text: '了解です　右手前をもう一度確認します' }
  - id: an-AR-02-blue-pot-02
    tone: serious
    when: { anomaly: AR-02-blue-pot }
    lines:
      - { who: M, text: '今度は右手前のほうへ　目を向けてみましょう' }
      - { who: A, text: 'えっ　右手前?　もう一度見る!' }
  - id: an-AR-02-cat-01
    tone: serious
    when: { anomaly: AR-02-cat }
    lines:
      - { who: A, text: 'もう少し視線を動かして　左のシャッターも見てみよう' }
      - { who: M, text: '分かりました　左のシャッターの周りを見直します' }
