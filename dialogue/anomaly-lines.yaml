# 異変ごとの会話（お手つきのときの小さなヒントを含む）。when.anomaly は prompts/anomalies.yaml の id。
# id は an-<異変id>-連番。各異変に二つのヒント案を登録する。
dialogues:
  - id: an-AR-01-notice-01
    tone: serious
    when: { anomaly: AR-01-notice }
    lines:
      - { who: A, text: '焦るとだめだね　左の壁をゆっくり確認しよう', en: "No good rushing. Let's take a slow look at the left wall." }
      - { who: M, text: 'そうですね　左の壁を少し引いて見ます', en: "Right. I'll take a closer look at the left wall." }
  - id: an-AR-01-notice-02
    tone: serious
    when: { anomaly: AR-01-notice }
    lines:
      - { who: M, text: 'いったん全体を見て　左の壁に戻ってください', en: "Please take in the whole scene, then go back to the left wall." }
      - { who: A, text: '分かった　左の壁は後でもう一度見るね', en: "Got it. I'll check the left wall again later." }
  - id: an-AR-02-ashtray-01
    tone: serious
    when: { anomaly: AR-02-ashtray }
    lines:
      - { who: A, text: '念のため　右手前も確かめておこう', en: "Let's check the near right side too, just in case." }
      - { who: M, text: 'はい　右手前の端も　見落とさないようにします', en: "Yes. I'll make sure not to miss the near-right edge." }
  - id: an-AR-02-ashtray-02
    tone: serious
    when: { anomaly: AR-02-ashtray }
    lines:
      - { who: M, text: '視点を少しずらして　右手前を見てみましょう', en: "Shift your view a little and take a look at the near right side." }
      - { who: A, text: 'そうか　右手前の前後も見てみるね', en: "I see. I'll check around the near right side too." }
  - id: an-AR-02-bag-01
    tone: serious
    when: { anomaly: AR-02-bag }
    lines:
      - { who: A, text: '右手前の床の辺り　見方を変えたら分かるかな', en: "Maybe a different angle will reveal something around the floor on the right?" }
      - { who: M, text: 'はい　右手前の床から順に　確認していきます', en: "Yes. I'll start at the near-right floor and check from there." }
  - id: an-AR-02-bag-02
    tone: serious
    when: { anomaly: AR-02-bag }
    lines:
      - { who: M, text: '焦らずに　右手前の床のあたりを　見てください', en: "Please take your time and check around the near-right floor." }
      - { who: A, text: 'えっ　右手前の床まで見るの?　ちゃんと見る!', en: "Huh? Even the near-right floor? I'll check properly!" }
  - id: an-AR-02-blue-pot-01
    tone: serious
    when: { anomaly: AR-02-blue-pot }
    lines:
      - { who: A, text: 'うーん　視線が止まってたね　右手前も見よう', en: "Hmm, I got fixated. Let's check the right side too." }
      - { who: M, text: '了解です　右手前をもう一度確認します', en: "Got it. I'll check the near right side again." }
  - id: an-AR-02-blue-pot-02
    tone: serious
    when: { anomaly: AR-02-blue-pot }
    lines:
      - { who: M, text: '今度は右手前のほうへ　目を向けてみましょう', en: "This time, try looking toward the near right side." }
      - { who: A, text: 'えっ　右手前?　もう一度見る!', en: "Huh? the near-right side? I'll look again!" }
  - id: an-AR-02-cat-01
    tone: serious
    when: { anomaly: AR-02-cat }
    lines:
      - { who: A, text: 'もう少し視線を動かして　左のシャッターも見てみよう', en: "Move your eyes a little farther and check the shutter on the left too." }
      - { who: M, text: '分かりました　左のシャッターの周りを　見直します', en: "Understood. I'll check around the shutter on the left again." }
  - id: an-AR-02-cat-02
    tone: serious
    when: { anomaly: AR-02-cat }
    lines:
      - { who: M, text: 'はい　今度は左のシャッターに　注目してみてください', en: "Please yes. This time, focus on the shutter on the left." }
      - { who: A, text: '左のシャッターを　見てるつもりだったのに　だめだね', en: "I thought I was watching the shutter on the left. Guess not." }
