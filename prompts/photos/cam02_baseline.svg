<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="floor2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#3a3a3a"/>
    </linearGradient>
    <radialGradient id="vig2" cx="0.5" cy="0.5" r="0.85">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
    <pattern id="scan2" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#00ff00" fill-opacity="0.04"/>
    </pattern>
    <pattern id="tile" width="50" height="25" patternUnits="userSpaceOnUse">
      <rect width="50" height="25" fill="none" stroke="#222" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="540" height="960" fill="#0a0a0a"/>
  <!-- ceiling -->
  <polygon points="0,0 540,0 320,420 220,420" fill="#1e1e1e"/>
  <!-- floor with tiles -->
  <polygon points="0,960 540,960 320,420 220,420" fill="url(#floor2)"/>
  <polygon points="0,960 540,960 320,420 220,420" fill="url(#tile)" opacity="0.5"/>
  <!-- left wall (shops) -->
  <polygon points="0,0 220,420 220,960 0,960" fill="#2a2a2a"/>
  <!-- right wall (shops) -->
  <polygon points="540,0 320,420 320,960 540,960" fill="#252525"/>
  <!-- left shopfront (CAFE) -->
  <rect x="30" y="320" width="170" height="420" fill="#1a2a3a" stroke="#333" stroke-width="2"/>
  <rect x="30" y="290" width="170" height="32" fill="#553322"/>
  <text x="115" y="313" font-family="sans-serif" font-size="16" fill="#ccaa88" text-anchor="middle">CAFE</text>
  <rect x="50" y="340" width="130" height="180" fill="#88aacc" opacity="0.3"/>
  <rect x="50" y="540" width="130" height="180" fill="#000" opacity="0.4"/>
  <!-- right shopfront (PHARMACY) -->
  <rect x="340" y="320" width="170" height="400" fill="#2a1a2a" stroke="#333" stroke-width="2"/>
  <rect x="340" y="290" width="170" height="28" fill="#332244"/>
  <text x="425" y="310" font-family="sans-serif" font-size="14" fill="#eecc99" text-anchor="middle">PHARMACY</text>
  <rect x="360" y="340" width="130" height="160" fill="#ddaa66" opacity="0.4"/>
  <rect x="360" y="520" width="130" height="180" fill="#000" opacity="0.4"/>
  <!-- ceiling lights -->
  <rect x="250" y="40" width="40" height="6" fill="#fffacd" opacity="0.8"/>
  <rect x="250" y="140" width="40" height="6" fill="#fffacd" opacity="0.7"/>
  <rect x="250" y="240" width="40" height="6" fill="#fffacd" opacity="0.6"/>
  <ellipse cx="270" cy="50" rx="180" ry="14" fill="#fffacd" opacity="0.12"/>
  <!-- distant corridor (vanishing) -->
  <rect x="240" y="380" width="80" height="50" fill="#000" opacity="0.7"/>
  <rect x="260" y="390" width="40" height="30" fill="#fffacd" opacity="0.3"/>
  <!-- exit sign -->
  <rect x="30" y="80" width="100" height="40" fill="#1a5a2a" stroke="#2a7a3a"/>
  <text x="80" y="108" font-family="monospace" font-size="20" fill="#9fe9aa" text-anchor="middle">EXIT</text>
  <!-- scanlines + vignette -->
  <rect width="540" height="960" fill="url(#scan2)"/>
  <rect width="540" height="960" fill="url(#vig2)"/>
  <!-- HUD -->
  <text x="20" y="40" font-family="monospace" font-size="14" fill="#3fa55f">REC ●  CAM 02</text>
  <text x="20" y="58" font-family="monospace" font-size="11" fill="#3fa55f" opacity="0.8">Main Corridor</text>
  <text x="440" y="940" font-family="monospace" font-size="11" fill="#3fa55f" opacity="0.7">placeholder</text>
</svg>
