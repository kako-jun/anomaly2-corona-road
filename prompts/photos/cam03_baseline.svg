<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="floor3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#2a2a2a"/>
    </linearGradient>
    <linearGradient id="shutter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5a5a"/>
      <stop offset="1" stop-color="#3a3a3a"/>
    </linearGradient>
    <radialGradient id="vig3" cx="0.5" cy="0.5" r="0.85">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
    <pattern id="scan3" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#00ff00" fill-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="540" height="960" fill="#0a0a0a"/>
  <!-- ceiling -->
  <polygon points="0,0 540,0 380,360 160,360" fill="#1e1e1e"/>
  <!-- floor -->
  <polygon points="0,960 540,960 380,360 160,360" fill="url(#floor3)"/>
  <!-- side walls -->
  <polygon points="0,0 160,360 160,960 0,960" fill="#2a2a2a"/>
  <polygon points="540,0 380,360 380,960 540,960" fill="#252525"/>
  <!-- shutter at far end (closed) -->
  <rect x="180" y="360" width="220" height="280" fill="url(#shutter)" stroke="#222" stroke-width="2"/>
  <g stroke="#222" stroke-width="1" opacity="0.7">
    <line x1="180" y1="380" x2="400" y2="380"/>
    <line x1="180" y1="400" x2="400" y2="400"/>
    <line x1="180" y1="420" x2="400" y2="420"/>
    <line x1="180" y1="440" x2="400" y2="440"/>
    <line x1="180" y1="460" x2="400" y2="460"/>
    <line x1="180" y1="480" x2="400" y2="480"/>
    <line x1="180" y1="500" x2="400" y2="500"/>
    <line x1="180" y1="520" x2="400" y2="520"/>
    <line x1="180" y1="540" x2="400" y2="540"/>
    <line x1="180" y1="560" x2="400" y2="560"/>
    <line x1="180" y1="580" x2="400" y2="580"/>
    <line x1="180" y1="600" x2="400" y2="600"/>
    <line x1="180" y1="620" x2="400" y2="620"/>
  </g>
  <!-- shutter top frame -->
  <rect x="175" y="350" width="230" height="14" fill="#1a1a1a"/>
  <!-- floor in front of shutter -->
  <rect x="160" y="640" width="220" height="40" fill="#1a1a1a"/>
  <!-- emergency exit sign -->
  <rect x="30" y="80" width="100" height="40" fill="#1a5a2a" stroke="#2a7a3a"/>
  <text x="80" y="108" font-family="monospace" font-size="20" fill="#9fe9aa" text-anchor="middle">EXIT</text>
  <!-- warning sign near shutter -->
  <rect x="40" y="580" width="90" height="70" fill="#aa8822"/>
  <text x="85" y="622" font-family="sans-serif" font-size="13" fill="#000" text-anchor="middle">CLOSED</text>
  <!-- ceiling light dim -->
  <rect x="250" y="80" width="40" height="6" fill="#fffacd" opacity="0.5"/>
  <ellipse cx="270" cy="86" rx="160" ry="14" fill="#fffacd" opacity="0.08"/>
  <!-- scanlines + vignette -->
  <rect width="540" height="960" fill="url(#scan3)"/>
  <rect width="540" height="960" fill="url(#vig3)"/>
  <!-- HUD -->
  <text x="20" y="40" font-family="monospace" font-size="14" fill="#3fa55f">REC ●  CAM 03</text>
  <text x="20" y="58" font-family="monospace" font-size="11" fill="#3fa55f" opacity="0.8">South Exit</text>
  <text x="440" y="940" font-family="monospace" font-size="11" fill="#3fa55f" opacity="0.7">placeholder</text>
</svg>
