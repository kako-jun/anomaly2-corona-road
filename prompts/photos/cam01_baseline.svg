<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="floor1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#3a3a3a"/>
    </linearGradient>
    <radialGradient id="vig1" cx="0.5" cy="0.5" r="0.85">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
    <pattern id="scan1" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#00ff00" fill-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="540" height="960" fill="#0a0a0a"/>
  <!-- ceiling -->
  <polygon points="0,0 540,0 380,360 160,360" fill="#1e1e1e"/>
  <!-- floor -->
  <polygon points="0,960 540,960 380,360 160,360" fill="url(#floor1)"/>
  <!-- left wall (stairs descending) -->
  <polygon points="0,0 160,360 160,960 0,960" fill="#2a2a2a"/>
  <!-- right wall -->
  <polygon points="540,0 380,360 380,960 540,960" fill="#252525"/>
  <!-- stair lines hint on left -->
  <g stroke="#444" stroke-width="1" opacity="0.6">
    <line x1="0" y1="460" x2="160" y2="460"/>
    <line x1="0" y1="560" x2="160" y2="560"/>
    <line x1="0" y1="660" x2="160" y2="660"/>
    <line x1="0" y1="760" x2="160" y2="760"/>
    <line x1="0" y1="860" x2="160" y2="860"/>
  </g>
  <!-- handrail -->
  <line x1="20" y1="380" x2="140" y2="940" stroke="#666" stroke-width="3"/>
  <!-- vending machine right side -->
  <rect x="400" y="540" width="110" height="280" fill="#3a4a5a" stroke="#222" stroke-width="2"/>
  <rect x="412" y="560" width="86" height="90" fill="#88ccff" opacity="0.4"/>
  <rect x="412" y="660" width="86" height="90" fill="#ffaa66" opacity="0.4"/>
  <rect x="412" y="760" width="86" height="40" fill="#222"/>
  <!-- exit sign upper left -->
  <rect x="30" y="80" width="100" height="40" fill="#1a5a2a" stroke="#2a7a3a"/>
  <text x="80" y="108" font-family="monospace" font-size="20" fill="#9fe9aa" text-anchor="middle">EXIT</text>
  <!-- ceiling light -->
  <rect x="250" y="100" width="40" height="8" fill="#fffacd" opacity="0.8"/>
  <ellipse cx="270" cy="108" rx="160" ry="20" fill="#fffacd" opacity="0.15"/>
  <!-- vanishing point shadow -->
  <rect x="220" y="330" width="100" height="40" fill="#000" opacity="0.6"/>
  <!-- scanlines -->
  <rect width="540" height="960" fill="url(#scan1)"/>
  <!-- vignette -->
  <rect width="540" height="960" fill="url(#vig1)"/>
  <!-- HUD -->
  <text x="20" y="40" font-family="monospace" font-size="14" fill="#3fa55f">REC ●  CAM 01</text>
  <text x="20" y="58" font-family="monospace" font-size="11" fill="#3fa55f" opacity="0.8">North Entrance</text>
  <text x="440" y="940" font-family="monospace" font-size="11" fill="#3fa55f" opacity="0.7">placeholder</text>
</svg>
